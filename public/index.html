<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>LoL Tournament Draft</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap');

body {
    margin: 0;
    padding: 20px;
    font-family: 'Oswald', sans-serif;
    background: transparent;
    color: white;
    overflow: hidden;
    text-shadow: 2px 2px 4px black;
}

#waiting {
    text-align: center;
    font-size: 2rem;
    margin-top: 20%;
    color: #aaa;
}

.draft-container {
    display: flex;
    justify-content: space-between;
    margin-top: 70px;
}

.team-column {
    width: 340px;
}

.team-header {
    border-bottom: 4px solid;
    padding-bottom: 5px;
}

.blue-header {
    border-color: #00a8ff;
}

.red-header {
    border-color: #ff4757;
    text-align: right;
}

.team-header h2 {
    margin: 0;
    font-size: 2.6rem;
}

.bans-container {
    display: flex;
    gap: 6px;
    margin-top: 8px;
}

.red-team .bans-container {
    justify-content: flex-end;
}

.ban-circle {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: rgba(0,0,0,.6);
    overflow: hidden;
    border: 2px solid #555;
}

.ban-circle img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: grayscale(100%);
}

.pick-card {
    height: 90px;
    display: flex;
    align-items: center;
    margin-bottom: 8px;
    background: linear-gradient(90deg, rgba(0,0,0,.85), rgba(0,0,0,.4));
    border-left: 4px solid #444;
}

.red-team .pick-card {
    flex-direction: row-reverse;
    border-left: none;
    border-right: 4px solid #444;
    background: linear-gradient(-90deg, rgba(0,0,0,.85), rgba(0,0,0,.4));
}

.pick-card img {
    width: 90px;
    height: 100%;
    object-fit: cover;
}

.pick-name {
    padding: 0 16px;
    font-size: 1.6rem;
}

.picking {
    border-color: gold !important;
    box-shadow: 0 0 15px rgba(255,215,0,.4);
}

.locked-blue {
    border-color: #00a8ff !important;
}

.locked-red {
    border-color: #ff4757 !important;
}

.timer-box {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 5rem;
    padding: 10px 35px;
    border-radius: 12px;
    border: 3px solid gold;
    background: rgba(0,0,0,.9);
}
</style>

<script src="/socket.io/socket.io.js"></script>
</head>

<body>

<div id="waiting">Esperando conexión...</div>

<div id="app" style="display:none">
    <div class="timer-box" id="timer">00</div>

    <div class="draft-container">
        <div class="team-column blue-team">
            <div class="team-header blue-header">
                <h2 id="blue-name">BLUE TEAM</h2>
                <div id="blue-bans" class="bans-container"></div>
            </div>
            <div id="blue-picks"></div>
        </div>

        <div class="team-column red-team">
            <div class="team-header red-header">
                <h2 id="red-name">RED TEAM</h2>
                <div id="red-bans" class="bans-container"></div>
            </div>
            <div id="red-picks"></div>
        </div>
    </div>
</div>

<script>
const socket = io();
const waiting = document.getElementById('waiting');
const app = document.getElementById('app');
const timerEl = document.getElementById('timer');

let localTimer = 0;
let interval = null;

function startTimer(value) {
    localTimer = Math.floor(value);
    updateTimer();
    clearInterval(interval);
    interval = setInterval(() => {
        if (localTimer > 0) {
            localTimer--;
            updateTimer();
        }
    }, 1000);
}

function updateTimer() {
    timerEl.innerText = localTimer < 10 ? `0${localTimer}` : localTimer;
    timerEl.style.color = localTimer <= 10 ? '#ff4757' : 'white';
}

function initSlots(containerId, count, html) {
    const c = document.getElementById(containerId);
    if (c.children.length === 0) {
        for (let i = 0; i < count; i++) {
            const d = document.createElement('div');
            d.innerHTML = html;
            d.firstChild.className = html.includes('ban') ? 'ban-circle' : 'pick-card';
            c.appendChild(d.firstChild);
        }
    }
}

function renderBans(bans, containerId) {
    console.log('[RENDER BANS]', containerId, bans);

    const container = document.getElementById(containerId);

    if (container.children.length === 0) {
        for (let i = 0; i < 5; i++) {
            const slot = document.createElement('div');
            slot.className = 'ban-circle';

            const img = document.createElement('img');
            slot.appendChild(img);

            container.appendChild(slot);
        }
    }

    const slots = container.children;

    for (let i = 0; i < 5; i++) {
        const img = slots[i].querySelector('img');
        const ban = bans[i];

        console.log(`[BAN SLOT ${i}]`, ban);

        if (ban && ban.championId > 0) {
            console.log('→ setting img:', ban.championImg);
            img.src = ban.championImg;
        } else {
            img.src = '';
        }
    }
}

function renderPicks(picks, containerId, side) {
    initSlots(containerId, 5, `<div class="pick-card"><img><span class="pick-name"></span></div>`);
    const slots = document.getElementById(containerId).children;

    picks.forEach((pick, i) => {
        const card = slots[i];
        const img = card.querySelector('img');
        const name = card.querySelector('.pick-name');

        card.classList.remove('picking', 'locked-blue', 'locked-red');

        if (pick.status === 'picking') card.classList.add('picking');
        if (pick.status === 'locked') card.classList.add(side === 'blue' ? 'locked-blue' : 'locked-red');

        if (pick.championId !== 0) {
            if (img.src !== pick.championImg) img.src = pick.championImg;
            name.innerText = pick.championName;
        } else {
            img.src = '';
            name.innerText = '';
        }
    });
}

socket.on('web-update', data => {
    if (!data) return;
    waiting.style.display = 'none';
    app.style.display = 'block';

    if (data.timer > localTimer || localTimer === 0) {
        startTimer(data.timer);
    }

    renderBans(data.blueTeam.bans, 'blue-bans');
    renderBans(data.redTeam.bans, 'red-bans');
    renderPicks(data.blueTeam.picks, 'blue-picks', 'blue');
    renderPicks(data.redTeam.picks, 'red-picks', 'red');
});
</script>

</body>
</html>
