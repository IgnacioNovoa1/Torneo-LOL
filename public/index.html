<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>LoL Tournament Draft</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Oswald', sans-serif;
            background: transparent;
            color: white;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes shimmer {
            0% {
                background-position: -1000px 0;
            }

            100% {
                background-position: 1000px 0;
            }
        }

        @keyframes glow {

            0%,
            100% {
                box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
            }

            50% {
                box-shadow: 0 0 40px rgba(255, 215, 0, 0.8);
            }
        }

        @keyframes slideInLeft {
            from {
                transform: translateX(-100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes scaleIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        #waiting {
            text-align: center;
            font-size: 3rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 4px;
            animation: pulse 2s infinite;
        }

        #waiting::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {

            0%,
            20% {
                content: '.';
            }

            40% {
                content: '..';
            }

            60%,
            100% {
                content: '...';
            }
        }

        .draft-container {
            display: flex;
            justify-content: space-between;
            width: 100%;
            padding: 0 40px;
            position: fixed;
            top: 50%;
            left: 0;
            right: 0;
            transform: translateY(-50%);
        }

        .team-column {
            width: 420px;
        }

        .blue-team {
            position: absolute;
            left: 40px;
        }

        .red-team {
            position: absolute;
            right: 40px;
        }

        .team-header {
            position: relative;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .team-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, currentColor, transparent);
            animation: shimmer 3s infinite;
        }

        .blue-header {
            color: #00d4ff;
            animation: slideInLeft 0.8s ease-out;
        }

        .blue-header::after {
            background: linear-gradient(90deg, transparent, #00d4ff, transparent);
        }

        .red-header {
            color: #ff4757;
            text-align: right;
            animation: slideInRight 0.8s ease-out;
        }

        .red-header::after {
            background: linear-gradient(90deg, transparent, #ff4757, transparent);
        }

        .team-header h2 {
            margin: 0;
            font-size: 3.5rem;
            font-family: 'Bebas Neue', cursive;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 0 20px currentColor, 2px 2px 8px rgba(0, 0, 0, 0.8);
        }

        .bans-container {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .red-team .bans-container {
            justify-content: flex-end;
        }

        .ban-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(0, 0, 0, .8);
            overflow: hidden;
            border: 3px solid #333;
            position: relative;
            transition: all 0.3s ease;
        }

        .ban-circle::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 70%;
            height: 3px;
            background: #ff0000;
            transform: translate(-50%, -50%) rotate(-45deg);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 2;
        }

        .ban-circle.has-ban {
            border-color: #ff0000;
            animation: scaleIn 0.4s ease-out;
        }

        .ban-circle.has-ban::before {
            opacity: 1;
        }

        .ban-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%) brightness(0.4);
            transition: filter 0.3s ease;
        }

        .ban-circle:hover {
            transform: scale(1.1);
            border-color: #ff0000;
        }

        .picks-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .pick-card {
            height: 100px;
            display: flex;
            align-items: center;
            background: linear-gradient(90deg, rgba(20, 20, 40, .95), rgba(0, 0, 0, .6));
            border-left: 5px solid #2a2a3a;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            opacity: 0;
            animation: slideInLeft 0.5s ease-out forwards;
        }

        .pick-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s ease;
        }

        .pick-card:hover::before {
            left: 100%;
        }

        .red-team .pick-card {
            flex-direction: row-reverse;
            border-left: none;
            border-right: 5px solid #2a2a3a;
            background: linear-gradient(-90deg, rgba(40, 20, 20, .95), rgba(0, 0, 0, .6));
            animation: slideInRight 0.5s ease-out forwards;
        }

        .pick-card:nth-child(1) {
            animation-delay: 0.1s;
        }

        .pick-card:nth-child(2) {
            animation-delay: 0.2s;
        }

        .pick-card:nth-child(3) {
            animation-delay: 0.3s;
        }

        .pick-card:nth-child(4) {
            animation-delay: 0.4s;
        }

        .pick-card:nth-child(5) {
            animation-delay: 0.5s;
        }

        .pick-card img {
            width: 100px;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .pick-card:hover img {
            transform: scale(1.1);
        }

        .pick-name {
            padding: 0 20px;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            flex: 1;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        .picking {
            border-color: gold !important;
            animation: glow 1.5s infinite, pulse 1s infinite;
        }

        .picking::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.1), transparent);
            animation: shimmer 2s infinite;
        }

        .locked-blue {
            border-color: #00d4ff !important;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .locked-red {
            border-color: #ff4757 !important;
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.3);
        }

        .timer-box {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 7rem;
            font-family: 'Bebas Neue', cursive;
            padding: 20px 50px;
            border-radius: 15px;
            border: 4px solid;
            background: rgba(0, 0, 0, .95);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
            transition: all 0.3s ease;
            animation: fadeIn 0.5s ease-out;
            letter-spacing: 8px;
        }

        .timer-box.warning {
            color: #ff4757;
            border-color: #ff4757;
            animation: pulse 0.5s infinite, glow 1s infinite;
        }

        .timer-box.normal {
            color: #fff;
            border-color: gold;
        }

        /* Hexagonal decorations */
        .timer-box::before,
        .timer-box::after {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            border: 3px solid gold;
            transform: rotate(45deg);
        }

        .timer-box::before {
            top: -15px;
            left: -15px;
        }

        .timer-box::after {
            bottom: -15px;
            right: -15px;
        }

        /* Center decoration line */
        .draft-container::before {
            display: none;
        }
    </style>

    <script src="/socket.io/socket.io.js"></script>
</head>

<body>

    <div id="waiting">Esperando Draft</div>

    <div id="app" style="display:none">
        <div class="timer-box normal" id="timer">00</div>

        <div class="draft-container">
            <div class="team-column blue-team">
                <div class="team-header blue-header">
                    <h2 id="blue-name">BLUE SIDE</h2>
                    <div id="blue-bans" class="bans-container"></div>
                </div>
                <div id="blue-picks" class="picks-container"></div>
            </div>

            <div class="team-column red-team">
                <div class="team-header red-header">
                    <h2 id="red-name">RED SIDE</h2>
                    <div id="red-bans" class="bans-container"></div>
                </div>
                <div id="red-picks" class="picks-container"></div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        const waiting = document.getElementById('waiting');
        const app = document.getElementById('app');
        const timerEl = document.getElementById('timer');

        let localTimer = 0;
        let interval = null;

        function startTimer(value) {
            localTimer = Math.floor(value);
            updateTimer();
            clearInterval(interval);
            interval = setInterval(() => {
                if (localTimer > 0) {
                    localTimer--;
                    updateTimer();
                }
            }, 1000);
        }

        function updateTimer() {
            timerEl.innerText = localTimer < 10 ? `0${localTimer}` : localTimer;

            if (localTimer <= 10) {
                timerEl.classList.remove('normal');
                timerEl.classList.add('warning');
            } else {
                timerEl.classList.remove('warning');
                timerEl.classList.add('normal');
            }
        }

        function renderBans(bans, containerId) {
            const container = document.getElementById(containerId);

            if (container.children.length === 0) {
                for (let i = 0; i < 5; i++) {
                    const slot = document.createElement('div');
                    slot.className = 'ban-circle';
                    const img = document.createElement('img');
                    slot.appendChild(img);
                    container.appendChild(slot);
                }
            }

            const slots = container.children;

            for (let i = 0; i < 5; i++) {
                const img = slots[i].querySelector('img');
                const ban = bans[i];

                if (ban && ban.championId > 0) {
                    img.src = ban.championImg;
                    slots[i].classList.add('has-ban');
                } else {
                    img.src = '';
                    slots[i].classList.remove('has-ban');
                }
            }
        }

        function renderPicks(picks, containerId, side) {
            const container = document.getElementById(containerId);

            if (container.children.length === 0) {
                for (let i = 0; i < 5; i++) {
                    const card = document.createElement('div');
                    card.className = 'pick-card';
                    card.innerHTML = '<img><span class="pick-name"></span>';
                    container.appendChild(card);
                }
            }

            const slots = container.children;

            picks.forEach((pick, i) => {
                const card = slots[i];
                const img = card.querySelector('img');
                const name = card.querySelector('.pick-name');

                card.classList.remove('picking', 'locked-blue', 'locked-red');

                if (pick.status === 'picking') {
                    card.classList.add('picking');
                }
                if (pick.status === 'locked') {
                    card.classList.add(side === 'blue' ? 'locked-blue' : 'locked-red');
                }

                if (pick.championId !== 0) {
                    if (img.src !== pick.championImg) {
                        img.src = pick.championImg;
                    }
                    name.innerText = pick.championName;
                } else {
                    img.src = '';
                    name.innerText = '';
                }
            });
        }

        socket.on('web-update', data => {
            if (!data) return;

            waiting.style.display = 'none';
            app.style.display = 'block';

            if (data.timer > localTimer || localTimer === 0) {
                startTimer(data.timer);
            }

            renderBans(data.blueTeam.bans, 'blue-bans');
            renderBans(data.redTeam.bans, 'red-bans');
            renderPicks(data.blueTeam.picks, 'blue-picks', 'blue');
            renderPicks(data.redTeam.picks, 'red-picks', 'red');
        });

        socket.on('disconnect', () => {
            waiting.style.display = 'block';
            app.style.display = 'none';
            waiting.innerText = 'Conexión Perdida';
        });

        socket.on('connect', () => {
            waiting.innerText = 'Esperando Draft';
        });
    </script>

</body>

</html>
